services:
  - type: web
    name: splitease
    runtime: node
    plan: free
    buildCommand: npm ci && npm ci --prefix server && npm ci --include=dev --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGOMS_VERSION
        value: 7.0.24
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "true"